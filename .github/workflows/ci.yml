name: Roblox-Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/minecaftmaker/docker-roblox.git
  IMAGE_NAME: docker-roblox-ci

jobs:
  repo:
    name: "01 Repo validation"
    runs-on: ubuntu-24.04
    steps:
      - name: Validate repository and scripts
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          test -f Dockerfile
          test -f docker-compose.yml
          test -f supervisord.conf
          test -f xorg.conf
          for f in scripts/*.sh; do
            test -s "$f"
            test "$(head -n1 "$f")" = '#!/usr/bin/env bash'
            bash -n "$f"
          done

  compose:
    name: "02 Compose validation"
    needs: repo
    runs-on: ubuntu-24.04
    steps:
      - name: Validate and render Compose policy
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          docker compose config --quiet
          docker compose config > /tmp/compose.yml
          grep -q '6080:6080' docker-compose.yml
          grep -q 'mem_limit: 2g' docker-compose.yml
          grep -q 'cpus: 2.0' docker-compose.yml
          grep -q 'shm_size: 1g' docker-compose.yml
          ! grep -q '5900:' docker-compose.yml
          ! grep -q '/dev/kvm' docker-compose.yml
          ! grep -q '/dev/dri' docker-compose.yml
          ! grep -q 'docker.sock' docker-compose.yml

  linux-config:
    name: "03 Linux desktop config"
    needs: repo
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Xorg Supervisor D-Bus and Sober config
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          grep -q 'Driver "dummy"' xorg.conf
          grep -q '1280x720' xorg.conf
          for p in xorg desktop selkies launcher; do grep -q "program:$p" supervisord.conf; done
          ! grep -q 'program:novnc' supervisord.conf
          grep -q 'dbus-daemon' scripts/entrypoint.sh
          grep -q 'dbus-run-session' scripts/entrypoint.sh
          grep -q 'dbus-run-session' scripts/launch-sober.sh
          grep -q 'org.vinegarhq.Sober' scripts/entrypoint.sh
          grep -q 'retrying in 10 seconds' scripts/entrypoint.sh

  selkies:
    name: "04 Selkies validation"
    needs: compose
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Selkies HTTP software-encode configuration
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          grep -q -- '--addr=0.0.0.0,::' scripts/start-selkies.sh
          grep -q -- '--port="${SELKIES_PORT:-6080}"' scripts/start-selkies.sh
          grep -q -- '--enable-https=false' scripts/start-selkies.sh
          grep -q -- '--use-cpu=true' scripts/start-selkies.sh
          grep -q -- '--encoder=h264enc' scripts/start-selkies.sh

  shellcheck:
    name: "05 ShellCheck"
    needs: repo
    runs-on: ubuntu-24.04
    steps:
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          sudo apt-get update
          sudo apt-get install -y shellcheck
          cd repo
          shellcheck scripts/*.sh

  security:
    name: "06 Security audit"
    needs: [repo, compose]
    runs-on: ubuntu-24.04
    steps:
      - name: Scan source and container policy
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          ! grep -RInE --exclude-dir=.git --exclude-dir=.github 'privileged:[[:space:]]*true|/dev/dri|/dev/kvm|docker.sock|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' Dockerfile docker-compose.yml scripts supervisord.conf xorg.conf
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:latest fs /src --severity HIGH,CRITICAL --ignore-unfixed

  dockerfile:
    name: "07 Dockerfile lint"
    needs: [repo, selkies, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Run Dockerfile BuildKit checks
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          docker build --check .
          ! grep -q 'SELKIES_BASIC_AUTH_PASSWORD=' Dockerfile
          ! grep -q 'SELKIES_BASIC_AUTH_USER=' Dockerfile

  buildx:
    name: "08 Buildx validation"
    needs: repo
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Buildx builder
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx inspect --bootstrap

  image:
    name: "09 Image build"
    needs: [compose, linux-config, selkies, dockerfile, buildx]
    runs-on: ubuntu-24.04
    steps:
      - name: Build and inspect the complete image
        timeout-minutes: 15
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          docker build -t "$IMAGE_NAME:ci" .
          docker image inspect "$IMAGE_NAME:ci" --format '{{.Os}}/{{.Architecture}}'
          docker run --rm --entrypoint /bin/bash "$IMAGE_NAME:ci" -lc 'test -x /opt/roblox-docker/entrypoint.sh && test -x /opt/roblox-docker/start-selkies.sh && test -x /opt/roblox-docker/launch-sober.sh && command -v dbus-daemon && command -v flatpak && command -v supervisord'

  runtime:
    name: "10 Runtime smoke test"
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - name: Start container and verify desktop runtime
        timeout-minutes: 15
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          docker build -t "$IMAGE_NAME:runtime" .
          docker run -d --name roblox-runtime --memory=2g --cpus=2 --shm-size=1g -p 6080:6080 "$IMAGE_NAME:runtime"
          trap 'docker logs roblox-runtime || true; docker rm -f roblox-runtime || true' EXIT
          for i in $(seq 1 30); do
            test "$(docker inspect -f '{{.State.Status}}' roblox-runtime)" = running && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Status}}' roblox-runtime)" = running
          docker exec roblox-runtime bash -lc 'test -S /tmp/.X11-unix/X0'
          docker exec roblox-runtime bash -lc 'command -v dbus-daemon && command -v dbus-run-session'
          docker port roblox-runtime 6080/tcp | grep -q ':6080'

  windows:
    name: "11 Windows validation"
    needs: repo
    runs-on: windows-2025
    steps:
      - name: Validate scripts and Compose on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 $env:REPO_URL repo
          Set-Location repo
          $files = Get-ChildItem scripts -Filter *.sh
          if ($files.Count -lt 4) { throw 'Missing expected shell scripts' }
          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            for ($i = 0; $i -lt $bytes.Length - 1; $i++) {
              if ($bytes[$i] -eq 13 -and $bytes[$i + 1] -eq 10) { throw "CRLF found in $($file.Name)" }
            }
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            if ($text.Split("`n")[0].TrimEnd("`r") -ne '#!/usr/bin/env bash') { throw "Bad shebang in $($file.Name)" }
          }
          $compose = Get-Content docker-compose.yml -Raw
          foreach ($needle in 'DISPLAY','XDG_RUNTIME_DIR','LIBGL_ALWAYS_SOFTWARE','SELKIES_PORT') {
            if ($compose -notmatch [regex]::Escape($needle)) { throw "Missing $needle" }
          }

  runtime-selkies:
    name: "12 Selkies runtime"
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Selkies service wiring
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          grep -q 'program:selkies' supervisord.conf
          grep -q 'start-selkies.sh' supervisord.conf
          grep -q '0.0.0.0,::' scripts/start-selkies.sh

  runtime-sober:
    name: "13 Sober runtime wiring"
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Sober launch and persistence wiring
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          grep -q 'org.vinegarhq.Sober' scripts/entrypoint.sh
          grep -q 'flatpak run org.vinegarhq.Sober' scripts/launch-sober.sh
          grep -q 'config/sober' docker-compose.yml
          grep -q 'org.vinegarhq.Sober' docker-compose.yml

  integration:
    name: "14 Integration graph"
    needs: [runtime-sel, runtime-sober, windows, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Validate final cross-platform configuration
        run: |
          set -euo pipefail
          git clone --depth 1 "$REPO_URL" repo
          cd repo
          docker compose config --quiet
          test -f Dockerfile
          test -f docker-compose.yml
          grep -q 'SELKIES_PORT: "6080"' docker-compose.yml
          grep -q 'SELKIES_PORT=6080' Dockerfile
          grep -q 'program:selkies' supervisord.conf
          grep -q 'program:launcher' supervisord.conf

  final:
    name: "15 Final gate"
    if: ${{ always() }}
    needs: [integration, runtime, windows, shellcheck]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation branch to pass
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "$results" | jq .
          if echo "$results" | jq -e 'to_entries | any(.value.result != "success")' >/dev/null; then
            echo 'CI validation failed.'
            exit 1
          fi
          echo 'Roblox-Docker CI passed.'
