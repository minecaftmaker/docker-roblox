[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:xorg]
command=/usr/lib/xorg/Xorg :0 -config /etc/X11/xorg.conf -nolisten tcp -noreset
user=roblox
environment=HOME="/home/roblox",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000"
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:desktop]
command=/opt/roblox-docker/desktop.sh
user=roblox
environment=HOME="/home/roblox",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:selkies]
command=/opt/roblox-docker/start-selkies.sh
user=roblox
environment=HOME="/home/roblox",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",SELKIES_PORT="6080"
autorestart=true
priority=30
startsecs=3
startretries=5
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:launcher]
command=/opt/roblox-docker/launch-sober.sh
user=roblox
environment=HOME="/home/roblox",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000"
autorestart=false
priority=40
startretries=2
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
